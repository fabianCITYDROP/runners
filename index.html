<!-- Appli Runners City Drop, v22 : version reliée au Google Sheet (voir config.js) ; gros caractères, 3 photos, aujourd'hui au milieu, recherche en haut, page des rappels ; v22 : corrections après test complet ; v23 : planning compact (grosses flottes), dates avec le mois, longs textes coupés sur les cartes ; v24 : rapide sur téléphone lent avec une grosse flotte (planning préparé par Google et rangé à part, écran redessiné seulement s'il change) ; v25 : message de fin de tournée simplifié (date en entier, plaques les unes sous les autres, sans heure ni prénom) ; v27 : une validation faite pendant la réception du planning part tout de suite après (avant : jusqu'à 5 min d'attente) ; envois sans photo passés par l'adresse (GET) car l'iPhone bloquait les envois classiques ; v28 : actualisation toutes les 30 s ; v29 : une validation part même si le runner ferme l'appli juste après ; v30 : signalement avec photos envoyé en deux temps (le passage d'abord, même appli fermée, les photos ensuite) ; attente plus longue et message « Google ne répond pas » au lieu d'un faux « Pas de réseau » ; v31 : photo allégée envoyée même appli fermée (la vraie suit à la réouverture) ; un envoi n'est plus jeté quand Google est seulement occupé ; annuler un passage déjà parti l'annule aussi chez Google ; v32 : un lien désactivé ne jette plus les envois ; annulation sûre même quand les envois arrivent dans le désordre ; photos gardées tant que le téléphone n'a pas confirmé les avoir rangées ; un véhicule envoyé ne réapparaît plus si l'appli est tuée juste après ; v33 : envois groupés en un seul appel (avec le script v12), moins de relectures chez Google, deux onglets ouverts sans perte, mémoire pleine sans blocage, une panne de Google n'affiche plus « Lien non reconnu » ; v34 : page bureau v10 (photos effacées au bout de 5 jours, avec le script v13) ; v35 : page bureau v11 plus rapide (avec le script v14) ; v36 : nouvelles demandes du bureau signalées (pastille « 1 nouvelle », bandeau, vibration, chiffre sur l'icône, notification si autorisée) ; v37 : vraies notifications des nouvelles demandes, même écran verrouillé (avec le script v15) ; v38 : les alertes gardent leur détail après une mise à jour de l'appli ; v39 : mise à jour automatique sans fermer l'appli ; v40 : gros bouton ACTIVER LES NOTIFICATIONS en haut de l'accueil tant qu'elles ne sont pas actives ; v41 : encadré des notifications plus sobre, mise à jour repérée chaque minute et appliquée après 30 s sans geste ; v42 (revue de nuit) : ouverture immédiate sur réseau faible (copie du téléphone après 3 s, polices sans bloquer), fiche et « Tout est OK » 2 à 3 fois plus rapides, double appui sans effet sur l'écran suivant, véhicule parti le matin et revenu le soir affiché pour son retour, pas de rechargement à minuit pendant une saisie, panne de Google signalée sur la ligne d'état au lieu d'un message toutes les 30 s ; v43 : horaires d'arrivée et de départ sur chaque demande dans la page « Rappels et demandes », plaque jamais coupée sur deux lignes ; v44 : toucher la notification ouvre directement « Rappels et demandes » avec la demande (son texte s'affiche tout de suite, le détail arrive de Google juste après) ; v45 : demandes sans point (ou sur un point non suivi) affichées dans « Autres demandes » au lieu d'être comptées sans apparaître ; demandes modifiables depuis la page bureau (avec le script v20) ; v47 : véhicules déjà repartis aujourd'hui rangés dans « Déjà partis » (repliés en bas du point, hors du compte « à voir », à part dans le récap) -->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Une colonne, en-tête sombre, deux onglets fixés en bas, fiche véhicule plein écran. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#F6F7F4; --line:#DCE0DA; --line-strong:#C9CFC8;
  --fg:#17201B; --muted:#5B655F; --head:#17201B; --head-fg:#FFFFFF; --head-muted:#C9D2CC; --head-accent:#B9D7C8;
  --accent:#1F5D45; --accent-fg:#FFFFFF; --accent-soft:#E3EEE8;
  --info:#23477A; --info-soft:#E4EAF4; --info-line:#B9C8DE;
  --warn:#8A3109; --warn-soft:#FBEADF;
  --red:#A11D1D; --red-soft:#FBE3E1; --yellow:#7A5A00; --yellow-soft:#FBF0C8;
  --sans:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1A211D; --surface-2:#222A25; --line:#2E3832; --line-strong:#3F4B44;
  --fg:#E8ECE9; --muted:#9AA69F; --head:#0B0F0D; --head-muted:#A9B5AE; --head-accent:#8FC4AA;
  --accent:#4FA383; --accent-fg:#0B0F0D; --accent-soft:#1E3329;
  --info:#9DB8E3; --info-soft:#1D2A3D; --info-line:#34496A;
  --warn:#F0A97C; --warn-soft:#3A2418; --red:#F29A93; --red-soft:#3D1C1A; --yellow:#E8C95A; --yellow-soft:#352C10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1A211D; --surface-2:#222A25; --line:#2E3832; --line-strong:#3F4B44;
  --fg:#E8ECE9; --muted:#9AA69F; --head:#0B0F0D; --head-muted:#A9B5AE; --head-accent:#8FC4AA;
  --accent:#4FA383; --accent-fg:#0B0F0D; --accent-soft:#1E3329;
  --info:#9DB8E3; --info-soft:#1D2A3D; --info-line:#34496A;
  --warn:#F0A97C; --warn-soft:#3A2418; --red:#F29A93; --red-soft:#3D1C1A; --yellow:#E8C95A; --yellow-soft:#352C10; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
[hidden]{display:none!important}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{background:var(--head);color:var(--head-fg);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:32px}
.brand b{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--head-accent)}
.who{border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--head-fg);font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;min-height:32px}
.who span{font-size:10px;opacity:.7}
span.who{display:inline-flex;align-items:center}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--head-muted)}
.source{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);font-size:12.5px;color:var(--head-muted)}
.source.alert{border-color:rgba(240,169,124,.5);color:#F6C9AC}
.source label,.source button{flex:none;border:none;background:none;padding:6px 0;color:var(--head-fg);font-weight:600;text-decoration:underline;cursor:pointer;white-space:nowrap}

/* Contenu */
main{flex:1;padding-top:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.mlabel{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.plate{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.model{font-size:15px;font-weight:600}
.spec{font-size:14px;color:var(--muted)}
.meta{font-size:13px;color:var(--muted)}
.pts{display:flex;gap:5px}
.pt{flex:1 1 auto;min-width:0;min-height:40px;padding:0 6px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;font-weight:600;letter-spacing:-.01em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:2px 16px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;min-width:58px;min-height:52px;padding:4px 8px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--muted)}
.day small{font-size:11.5px;font-weight:600}
.day b{font-size:16px;font-weight:700;color:var(--fg)}
.day.on{background:var(--head);border-color:var(--head);color:var(--head-muted)}
.day.on b{color:var(--head-fg)}
.later{padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line-strong);font-size:14px;color:var(--muted)}
.pill.mine{background:var(--red-soft);color:var(--red)}
.pill.late{background:var(--warn-soft);color:var(--warn)}
.dateinput{width:100%;min-height:56px;padding:10px 12px;border-radius:12px;border:2px solid var(--line-strong);background:var(--surface);font-size:17px}
.imp.mine{background:var(--red-soft);color:var(--red)}
.imp.mine .imp-t{color:var(--fg)}
.imp .lnk{align-self:flex-start;margin-top:4px;padding:6px 0;border:none;background:none;font-size:14px;font-weight:600;color:inherit;text-decoration:underline}
.psec{display:flex;flex-direction:column;gap:12px}
.psec+.psec{margin-top:10px}
.pband{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--head);color:var(--head-fg);box-shadow:0 4px 10px rgba(0,0,0,.12)}
.pband h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.pband-n{font-size:13px;color:var(--head-muted);white-space:nowrap}
.pband-n b{font-size:18px;color:var(--head-fg)}
.pband.ask{background:var(--red);color:var(--surface)}
.pband.ask h2{font-size:18px}
.pband.ask .pband-n,.pband.ask .pband-n b{color:var(--surface)}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,20,.05);text-align:left}
.row:active{background:var(--surface-2)}
.row.ask{border:2px solid var(--red)}
.pill.ask{background:var(--red-soft);color:var(--red)}
.pill.seen{background:var(--accent-soft);color:var(--accent)}
.pill.unseen{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.times2{display:flex;flex-direction:column;gap:1px;font-size:14px;color:var(--muted)}
.times2 b{font-weight:600;color:var(--fg)}
.days{cursor:grab;user-select:none}
.row-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-t{display:flex;align-items:center;justify-content:space-between;gap:6px 8px;flex-wrap:wrap}
.chev{color:var(--muted);flex:none}
.pill{padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.dep{background:var(--warn-soft);color:var(--warn)}
.pill.gone{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-strong)}
.gone{border-radius:12px;border:1px dashed var(--line-strong);background:var(--surface-2)}
.gone>summary{cursor:pointer;padding:12px 14px;font-weight:600;color:var(--muted);list-style-position:inside}
.gone>summary b{margin-left:4px;color:var(--fg)}
.gone[open]{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.gone>.row{width:calc(100% - 20px);margin:0 10px;opacity:.85}
.pill.arr{background:var(--info-soft);color:var(--info)}
.mini{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500}
.mini i,.imp-h i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.mini.meca{color:var(--red)}.mini.normal{color:var(--yellow)}.mini.dmg{color:var(--warn)}.mini.ok{color:var(--accent)}.mini.info{color:var(--info)}
.consigne{font-size:14px;color:var(--fg)}
.empty{display:flex;flex-direction:column;gap:4px;padding:32px 16px;border:1px dashed var(--line-strong);border-radius:14px;text-align:center;color:var(--muted);font-size:14px}
.empty b{color:var(--fg);font-size:15px}
.empty.small{padding:16px}
.prog{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.prog-h{display:flex;justify-content:space-between;align-items:baseline}
.prog-h b{font-size:22px;font-weight:700}.prog-h b span{font-size:14px;font-weight:500;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list .row{border:none;border-radius:0;box-shadow:none}
.list .row+.row{border-top:1px solid var(--line)}
.okdot{width:28px;height:28px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.okdot svg{width:14px;height:14px}
.okdot.ko{background:var(--warn-soft);color:var(--warn);font-weight:700}
.okdot.wait{background:var(--surface-2);color:var(--muted)}
pre.report{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.5px;line-height:1.5;padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.gate{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:32px 8px;text-align:center}
.gate b{font-size:20px}
.gate p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}

/* Boutons et champs */
.btn{min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%;min-height:52px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.big{width:100%;min-height:60px;font-size:17px;font-weight:700;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.warn{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.btn.warn-o{background:var(--surface);border:2px solid var(--warn);color:var(--warn)}
.btn.ghosttxt{border:none;background:transparent;color:var(--muted);text-decoration:underline}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 8px 0 0;border:none;background:transparent;font-size:16px;font-weight:600;color:var(--accent)}
input[type=search],textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface)}
textarea{min-height:80px;resize:vertical}
input.plateinput{font-family:var(--mono);text-transform:uppercase;font-size:22px;min-height:56px;letter-spacing:.04em}

/* Choix du runner (démonstration) */
.picker{overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--accent)}
.choice{display:flex;flex-direction:column;margin:0 -14px -14px;border-top:1px solid var(--line)}
.opt-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border:none;background:transparent;font-size:15px;font-weight:500;text-align:left}
.opt-row+.opt-row{border-top:1px solid var(--line)}
.opt-row .box{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center}
.opt-row .box svg{width:13px;height:13px}
.opt-row.on{color:var(--accent);font-weight:600}
.opt-row.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* Fiche véhicule */
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column}
.sh-top{position:sticky;top:0;z-index:1;background:var(--bg);padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:4px}
.sh-id{display:flex;flex-direction:column;gap:4px;padding-top:4px;padding-bottom:12px}
.plate.xl{font-size:28px}
.sh-id .model{font-size:17px}
.sh-body{flex:1;display:flex;flex-direction:column;gap:12px;padding-top:4px;padding-bottom:16px}
.sh-foot{position:sticky;bottom:0;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.card0{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.times{display:grid;grid-template-columns:1fr 1px 1fr;gap:12px;padding:12px 14px}
.times .sep{background:var(--line)}
.tc{display:flex;flex-direction:column;gap:2px;min-width:0}
.tt{font-size:20px;font-weight:700;letter-spacing:-.01em}
.tt.muted{color:var(--muted)}
.td{font-size:12.5px;color:var(--muted)}
.sec{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.evl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.evl li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13.5px}
.evl li+li{border-top:1px dashed var(--line)}
.evl em{font-style:normal;font-size:12px;color:var(--warn);white-space:nowrap}
.imp{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:10px}
.imp-h{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.imp-t{font-size:14px;font-weight:600}
.imp-p{font-size:13px;font-weight:500}
.imp-p span{opacity:.75;font-weight:400}
.imp.meca{background:var(--red-soft);color:var(--red)}
.imp.normal{background:var(--yellow-soft);color:var(--yellow)}
.imp.info{background:var(--red-soft);color:var(--red)}
.imp.info .imp-t{color:var(--fg)}
.status{padding:12px 14px;border-radius:12px;font-weight:600;font-size:15px}
.status.ok{background:var(--accent-soft);color:var(--accent)}
.status.ko{background:var(--warn-soft);color:var(--warn)}
.q{font-size:20px;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{min-height:64px;padding:10px 12px;border-radius:12px;border:2px solid var(--line-strong);background:var(--surface);font-size:15px;font-weight:600;text-align:left}
.tile.on{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.tile small{font-size:13px;font-weight:500;color:var(--muted)}
.tile.on small{color:inherit}
.tile.pick.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.photo{border-style:dashed}
.photo img{width:40px;height:40px;object-fit:cover;border-radius:6px}

/* Barre du bas et message */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:4}
nav.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:4px}
nav.tabs button{min-height:60px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.cnt{display:inline-block;min-width:22px;padding:1px 6px;margin-left:2px;border-radius:999px;background:var(--surface-2);color:var(--fg);font-size:12px}
nav.tabs button.on .cnt{background:var(--accent);color:var(--accent-fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:max-content;max-width:min(440px,calc(100% - 32px));padding:10px 14px;border-radius:10px;background:var(--head);color:var(--head-fg);font-size:14px;z-index:30}
/* v19 : lisibilité sur petit téléphone, pour tous les âges */
body{font-size:17px}

(function(){
'use strict';

/* ---------- Réglages ---------- */
const API=String((window.CONFIG&&window.CONFIG.api)||'').trim();

const MAX_PHOTOS=3;

/* Points City Drop d'Île-de-France (La Def : adresse à Nanterre) et noms courts des boutons */

const SHORT={'Saint-Cloud':'St-Cloud','Paris-Centre':'Paris'};

/* Autres écritures possibles dans l'export, ramenées au nom du point */
const ALIAS={'nanterre':'La Def','la def':'La Def','la defense':'La Def','paris la defense':'La Def','saint cloud':'Saint-Cloud','st cloud':'Saint-Cloud','aulnay':'Aulnay','aulnay sous bois':'Aulnay','paris centre':'Paris-Centre','coignieres':'Coignières'};
const DAMAGES=['Impact pare-brise','Pare-brise fissuré','Pneu avant à changer','Pneu arrière à changer','Rétroviseur endommagé','Choc carrosserie','Feu cassé','Voyant au tableau de bord'];

/* ---------- Icônes ---------- */
const svg=(d,w,sw)=>`<svg width="${w||22}" height="${w||22}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

  done:svg('<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>'),

/* ---------- Dates ---------- */
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayOffset(n){const d=new Date();d.setDate(d.getDate()+n);return iso(d)}
const TODAY=dayOffset(0);
function hm(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function nowStr(){const d=new Date();return iso(d)+' '+hm(d)}
const DOW=['Dim.','Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.'];const MON=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function dLabel(isoD){const [y,m,d]=isoD.split('-').map(Number);const x=new Date(y,m-1,d);return {dow:DOW[x.getDay()],num:d+' '+MON[m-1]}}
function dayDiff(d){const [y,m,j]=d.split('-').map(Number);const [a,b,c]=TODAY.split('-').map(Number);return Math.round((new Date(y,m-1,j)-new Date(a,b-1,c))/864e5)}
/* « aujourd'hui 15h30 », « demain 17h30 », « hier 18h00 » ou « sam. 17 oct. 9h00 » */
function when(t){if(!t)return '';const [d,h]=t.split(' ');const n=dayDiff(d);
  const day=n===0?"aujourd'hui":n===1?'demain':n===-1?'hier':(l=>l.dow.toLowerCase()+' '+l.num)(dLabel(d));const [hh,mm]=h.split(':');return day+' à '+Number(hh)+'h'+(mm==='00'?'':mm)}

/* ---------- Lecture de l'export (CSV chargé à la main ou tableau envoyé par Google) ---------- */
const COLS={
  plaque:['plaque','immat','immatriculation'],categorie:['categorie','catégorie'],modele:['modele','modèle','marque_modele','marque modèle','marque_modele_annee','vehicule','véhicule'],km:['km','kilometrage','kilométrage'],
  villeDep:['ville_depart','ville départ'],dateDep:['date_depart','date départ','date'],heureDep:['heure_depart','heure départ'],
  villeArr:['ville_arrivee','ville arrivée'],dateArr:['date_arrivee','date arrivée'],heureArr:['heure_arrivee','heure arrivée'],
  events:['evenements_bo','événements bo','evenements bo','evenements'],
  impro:['impro_type','improductif','impro'],improDeb:['impro_debut','impro début'],improFin:['impro_fin'],improLib:['impro_libelle','impro_libellé','impro libellé']
};
function city(s){s=String(s||'').trim();const k=s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[-_]/g,' ').replace(/\s+/g,' ');return ALIAS[k]||s}
function normDate(s){
  s=String(s||'').trim();let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return m[1]+'-'+m[2]+'-'+m[3];
  if((m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})/)))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})(?!\d)/)))return (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  /* Formats de Metabase : « October 15, 2026 », « Oct 15, 2026 », « 15 octobre 2026 », « jeu. 15 oct. 2026 » */
  const t=s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const mo=k=>{const F=['janv','fevr','mars','avr','mai','juin','juil','aout','sept','oct','nov','dec'];
    for(let i=0;i<12;i++)if(k.indexOf(F[i])===0)return i+1;
    const en={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};return en[k.slice(0,3)]||0};
  if((m=t.match(/^(?:[a-z]+\.?,?\s+)?([a-z]+)\.?\s+(\d{1,2}),?\s+(\d{4})/))&&mo(m[1]))return m[3]+'-'+String(mo(m[1])).padStart(2,'0')+'-'+m[2].padStart(2,'0');
  if((m=t.match(/^(?:[a-z]+\.?,?\s+)?(\d{1,2})(?:er)?\s+([a-z]+)\.?,?\s+(\d{4})/))&&mo(m[2]))return m[3]+'-'+String(mo(m[2])).padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return '';
}
function normTime(s){s=String(s||'');const m=s.match(/(\d{1,2})[:hH](\d{2})?/);if(!m)return '00:00';let h=+m[1];if(/pm/i.test(s)&&h<12)h+=12;if(/am/i.test(s)&&h===12)h=0;return String(h).padStart(2,'0')+':'+(m[2]||'00')}
/* « 15/10/2026 16:00 », « 2026-10-15T16:00:00 » ou date et heure séparées → « 2026-10-15 16:00 » */
function dt(dateStr,timeStr){const d=normDate(dateStr);if(!d)return '';
  const t=timeStr&&String(timeStr).trim()?timeStr:String(dateStr).trim().split(/[ T,]+/).slice(1).join(' ');return d+' '+normTime(t)}
function normImpro(s){s=String(s||'').trim().toLowerCase();if(!s||s==='non'||s==='0')return '';return /m[ée]ca/.test(s)?'meca':'normal'}
function parseEvents(s){
  return String(s||'').split('|').map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)\s*\(([^)]*)\)\s*$/);return m?{label:m[1],status:m[2]}:{label:x,status:''}});
}
function parseTable(head,rows){
  head=(head||[]).map(h=>String(h).trim().toLowerCase());
  if(!head.length)return {loc:[],impros:[]};
  const idx={};for(const k in COLS)idx[k]=head.findIndex(h=>COLS[k].includes(h));
  const missing=['plaque','dateDep','villeDep','villeArr'].filter(k=>idx[k]<0);
  if(missing.length)throw new Error('Colonnes manquantes : '+missing.map(k=>COLS[k][0]).join(', ')+'.');
  const loc=[],impros=[];
  rows.forEach(c=>{
    const g=k=>idx[k]>=0?String(c[idx[k]]==null?'':c[idx[k]]).trim():'';
    const plaque=g('plaque').toUpperCase();if(!plaque)return;
    const type=normImpro(g('impro'));
    if(type){const debut=dt(g('improDeb')),fin=dt(g('improFin'));if(debut)impros.push({plaque,type,debut,fin,libelle:g('improLib')});return}
    const dep=dt(g('dateDep'),g('heureDep'));if(!dep)return;
    const arr=dt(g('dateArr')||g('dateDep'),g('heureArr'));
    const km=parseInt(g('km').replace(/\D/g,''),10);
    loc.push({plaque,modele:g('modele'),categorie:g('categorie'),km:isNaN(km)?null:km,villeDep:city(g('villeDep')),dep,villeArr:city(g('villeArr')),arr,events:parseEvents(g('events'))});
  });
  return {loc,impros};
}
function splitLine(line,sep){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===sep){out.push(cur);cur=''}else cur+=c}
  out.push(cur);return out;
}
/* Planning reçu de Google : déjà préparé par le script v6 (rapide), sinon tableau brut de l'export */
function readPlan(pl){
  if(pl&&pl.erreur)throw new Error(pl.erreur);
  if(pl&&pl.v===2)return {
    loc:pl.loc.map(a=>({plaque:a[0],modele:a[1],categorie:a[2],km:a[3]===''||a[3]==null?null:+a[3],villeDep:a[4],dep:a[5],villeArr:a[6],arr:a[7],events:a[8]?parseEvents(a[8]):[]})),
    impros:pl.impros.map(a=>({plaque:a[0],type:a[1],debut:a[2],fin:a[3],libelle:a[4]}))};
  return parseTable(pl.entetes,pl.lignes);
}
function parseCsv(text){
  const lines=text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)throw new Error('Le fichier est vide.');
  const sep=lines[0].split(';').length>=lines[0].split(',').length?';':',';
  const t=parseTable(splitLine(lines[0],sep),lines.slice(1).map(l=>splitLine(l,sep)));
  if(!t.loc.length&&!t.impros.length)throw new Error('Aucune ligne lisible dans le fichier.');
  return t;
}

/* ---------- Données de démonstration (fictives) ---------- */

function call(params,body,ms){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms||45000);

  if(body&&!(body.photos&&body.photos.length)){params={j:JSON.stringify(body),code:body.code||''};body=null}
  const url2=params?API+'?'+new URLSearchParams(params):API;
  const opt=body?{method:'POST',body:JSON.stringify(body),signal:ctl.signal}:{signal:ctl.signal,cache:'no-store'};
  return fetch(url2,opt).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).finally(()=>clearTimeout(t));
}
let busy=false,again=false,retryT=0;

   qui les termine même appli fermée. Ils restent aussi dans la file : au prochain envoi, Google reconnaît

function flushOnHide(){

  const now=Date.now(),lot=[];

    /* Une annulation suivie d'une nouvelle validation du même véhicule attend la réouverture (l'ordre compte) */
    if(q.action==='annuler'&&!q.cible&&S.queue.slice(j+1).some(x=>x.action==='passage'&&x.cle===q.cle))return;

      if(S.srv>=12){delete b.code;lot.push(b)}

    if(q.mini&&!q.miniSent){const b=baseOf(q);b.action='photos';b.allegee=true;b.photos=[q.mini];const txt=JSON.stringify(b);

function lots(list){const out=[];let cur=[],len=0;list.forEach(b=>{const l=encodeURIComponent(JSON.stringify(b)).length;if(cur.length&&(cur.length>=10||len+l>5500)){out.push(cur);cur=[];len=0}cur.push(b);len+=l});if(cur.length)out.push(cur);return out}

/* Réponse de Google à un envoi : 'stop' (on garde la suite pour plus tard) ou 'suite' */
function handled(q,r){

  if(r.erreur&&r.reessayer){S.offline=true;return 'stop'}

  if(r.erreur&&/^Lien inconnu/.test(r.erreur)){S.blocked=r.erreur;return 'stop'}

  if(r.erreur&&q.action==='abonnement'){S.abonneRefus=S.abonne;S.abonne=''}
  else if(r.erreur){toast('Envoi refusé : '+r.erreur)}

  else if(q.action==='annuler')removeLast(S.passages,q.cle,q.plaque);

    while(S.queue.length){
      const q=S.queue[0];

        let r;items.forEach(x=>{x.inflight=x.tried=true});

/* Arrivée et départ sur deux lignes, avec le jour */
/* Court : « Auj. 11h », « Dem. 17h30 », « Hier 23h », « Sam. 17 9h » */
function short(t){if(!t)return '';const [d,h]=t.split(' ');const n=dayDiff(d);const l=dLabel(d);const day=n===0?'Auj.':n===1?'Dem.':n===-1?'Hier':l.dow+' '+l.num+' à';const [hh,mm]=h.split(':');return day+' '+Number(hh)+'h'+(mm==='00'?'':mm)}
function timesHtml(s){return `<span class="tgrid"><span><small>Arrivée</small><b>${s.from?esc(short(s.from)):'Sur place'}</b></span><span><small>Départ</small><b>${s.to?esc(short(s.to)):'Pas prévu'}</b></span></span>`}
/* Texte d'improductif limité à 2 lignes sur la carte ; en entier dans la fiche */
function improMini(i){return `<span class="bar ${i.type}"><i></i><span class="bl">${i.type==='meca'?'RDV méca':esc(i.libelle||'Improductif')}</span><span class="bd">${esc(short(i.debut))}${i.fin?' → '+esc(short(i.fin)):''}</span></span>`}
function dayChip(d,i,attr,sel){const l=dLabel(d);const n=dayDiff(d);const on=d===sel;return `<button type="button" class="day ${on?'on':''}" ${attr}="${d}" aria-pressed="${on}" aria-label="${esc(l.dow+' '+l.num)}"><small>${n===0?'Auj.':n===1?'Dem.':n===-1?'Hier':l.dow}</small><b>${Number(d.slice(8))}</b></button>`}
function rowHtml(p,inner,cls){return `<button type="button" class="row ${cls||''}" data-open="${esc(p)}"><span class="row-b">${inner}</span><span class="chev">${I.chev}</span></button>`}
function gate(title,text,btn){return `<div class="gate"><b>${title}</b><p>${text}</p>${btn||''}</div>`}

function vHome(){
  const pts=LOCAL.concat(allPoints().filter(p=>S.myPoints.includes(p)&&!LOCAL.includes(p)));
  const order=S.myPoints.slice().sort((a,b)=>pts.indexOf(a)-pts.indexOf(b));
  const now=DAY===TODAY,past=DAY<TODAY;const list=past?staysOn(DAY):todo(DAY),asks=openAsks(DAY),gone=now?partis(DAY):[];
  const days=[];for(let i=-DAYS_BACK;i<=DAYS_AHEAD;i++)days.push(plusDays(i));
  return `${alertesHtml(true)}
  <div class="days" role="group" aria-label="Jour">${days.map((d,i)=>dayChip(d,i,'data-day',DAY)).join('')}</div>
  <div class="pts" role="group" aria-label="Mes points">${pts.map(p=>{const on=S.myPoints.includes(p);return `<button type="button" class="pt ${on?'on':''}" data-point="${esc(p)}" aria-pressed="${on}" title="${esc(p)}">${esc(SHORT[p]||p)}</button>`}).join('')}</div>
  <button type="button" class="askbtn ${asks.length?'':'none'}" id="openAsks"><span>Rappels et demandes</span><span class="askn">${(()=>{const n=DEMO?0:newAsks().length;return n?`<span class="newn">${n} nouvelle${n>1?'s':''}</span>`:''})()}${asks.length?`<b>${asks.length}</b>`:'aucun'}${I.chev}</span></button>
  ${now?'':`<div class="later">${past?'Journée':'Planning'} ${esc(duWord(DAY))} : à consulter seulement. Les véhicules se valident le jour même.</div>`}
  ${!order.length?'<div class="empty"><b>Choisissez votre point</b><span>Touchez un point ci-dessus.</span></div>':''}
  ${(()=>{/* v45 : demandes sans point connu, ou sur un point non suivi : avant, comptées dans le total mais affichées nulle part */
    const ot=asks.filter((d,i,a)=>!order.includes(askPt(d))&&a.findIndex(x=>x.plaque===d.plaque)===i);if(!ot.length)return '';
    return `<section class="psec"><div class="pband"><h2>Autres demandes</h2><div class="pband-n"><b>${ot.length}</b> à voir</div></div>${ot.map(d=>askCard(d,stayFor(d.plaque,DAY),askPt(d)?'Point : '+full(askPt(d)):'Point non précisé')).join('')}</section>`})()}
  ${order.map(p=>{const pa=asks.filter((d,i,a)=>askPt(d)===p&&a.findIndex(x=>x.plaque===d.plaque)===i);const l=list.filter(s=>s.point===p&&!pa.some(d=>d.plaque===s.plaque));return `
  <section class="psec">
    <div class="pband"><h2>${esc(full(p))}</h2><div class="pband-n"><b>${l.length+pa.length}</b> ${now?'à voir':'sur place'}</div></div>
    ${pa.map(d=>askCard(d,staysOn(DAY).find(s=>s.plaque===d.plaque&&s.point===p))).join('')}
    ${l.length||pa.length?l.map(s=>{const v=vehicle(s.plaque)||{};const imp=s.impros[0];return rowHtml(s.plaque,`
        <span class="row-t"><span class="plate">${esc(s.plaque)}</span>${past?(P[sid(s)]?'<span class="pill seen">Vu</span>':'<span class="pill unseen">Pas vu</span>'):s.leaves?`<span class="pill dep">${now?'Part aujourd\'hui':'Part ce jour-là'}</span>`:s.arrives?'<span class="pill arr">Arrive</span>':''}</span>
        <span class="model">${esc(v.modele||'')}</span>
        ${timesHtml(s)}
        ${s.impros.map(improMini).join('')}`)}).join(''):`<div class="empty small"><b>${now?'Tout est fait sur ce point':'Aucun véhicule prévu sur ce point'}</b></div>`}
    ${(g=>g.length?`<details class="gone"><summary>Déjà partis <b>${g.length}</b></summary>${g.map(s=>{const v=vehicle(s.plaque)||{};return rowHtml(s.plaque,`<span class="row-t"><span class="plate">${esc(s.plaque)}</span><span class="pill gone">Parti</span></span><span class="model">${esc(v.modele||'')}</span>${timesHtml(s)}`)}).join('')}</details>`:'')(gone.filter(s=>s.point===p))}
  </section>`}).join('')}`;
}

/* Point d'un rappel : celui choisi, sinon celui du planning ce jour-là */
function askPt(d){return d.point||((stayFor(d.plaque,DAY)||{}).point)||''}
function askPill(d){return d.date<TODAY?`<span class="pill late">Prévu ${esc(dayWord(d.date))}</span>`:d.auteur===S.who?'<span class="pill mine">Mon rappel</span>':'<span class="pill ask">Service parc</span>'}
/* Rappel ou demande dans la liste du point, même si le planning ne met pas le véhicule ici */
function askCard(d,s,ou){const v=vehicle(d.plaque)||{};return rowHtml(d.plaque,`<span class="row-t"><span class="plate">${esc(d.plaque)}</span>${askPill(d)}</span>${v.modele?`<span class="model">${esc(v.modele)}</span>`:''}<span class="consigne">${esc(d.consigne||'Passer voir ce véhicule.')}</span>${ou?`<span class="spec">${esc(ou)}</span>`:''}${s?timesHtml(s)+s.impros.map(improMini).join(''):'<span class="spec">Pas prévu ici dans le planning</span>'}`,'ask')}
function cap(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function vAsks(){
  const now=DAY===TODAY,cur=openAsks(DAY),from=DAY>TODAY?DAY:TODAY;
  const later=allAsks().filter(d=>d.date>from).sort((a,b)=>a.date.localeCompare(b.date));
  /* v43 : horaires d'arrivée et de départ (planning Metabase) sur chaque demande, comme dans la liste des véhicules */
  const row=d=>{const v=vehicle(d.plaque)||{};const st=stayFor(d.plaque,d.date<TODAY?TODAY:d.date);const pt=d.point||(st||{}).point||'';return rowHtml(d.plaque,`<span class="row-t"><span class="plate">${esc(d.plaque)}</span>${d.auteur===S.who?'<span class="pill mine">Mon rappel</span>':'<span class="pill ask">Service parc</span>'}${sheet&&sheet.nouv&&sheet.nouv.includes(d.id)?'<span class="pill new">Nouvelle</span>':''}</span>${v.modele?`<span class="model">${esc(v.modele)}</span>`:''}<span class="consigne">${esc(d.consigne||'Passer voir ce véhicule.')}</span><span class="spec">${esc((d.date<TODAY?'Prévu '+dayWord(d.date):cap(dayWord(d.date)))+(pt?' · '+full(pt):''))}</span>${st?timesHtml(st)+st.impros.map(improMini).join(''):'<span class="spec">Pas dans le planning ce jour-là</span>'}`,'ask')};
  return `<div class="sh-top pad"><button type="button" class="back" id="closeSheet">${I.back}Retour</button></div>
  <div class="sh-body pad">
    <div class="q">Rappels et demandes</div>
    ${attenteHtml()}
    ${alertesHtml()}
    <button type="button" class="btn big primary" id="openRemind">${I.clockL}Ajouter un rappel</button>
    <div class="mlabel">${now?"Aujourd'hui":esc(cap(dayWord(DAY)))}</div>
    ${cur.length?cur.map(row).join(''):attenteHtml()?'':'<div class="empty small"><b>Aucun rappel ni demande</b></div>'}
    ${later.length?`<div class="mlabel">Prochains jours</div>${later.map(row).join('')}`:''}
  </div>`;
}

  const d=doneOn(DONE_DAY);const pb=d.filter(x=>x.pb.length).length;const today=DONE_DAY===TODAY;
  const hist=[];for(let i=-(HISTORY_DAYS-1);i<=0;i++)hist.push(plusDays(i));
  if(showReport)return `
  <div><button type="button" class="back" id="closeReport">${I.back}Retour</button></div>
  <div class="mlabel">Message pour le service parc</div>
  <pre class="report" id="reportText">${esc(report())}</pre>
  ${DEMO?`<button type="button" class="btn big primary" id="copy">Copier le message</button>
  <div class="meta">Démonstration : le message se copie. Dans la version reliée, il part tout seul.</div>`
  :`<button type="button" class="btn big primary" id="send">Envoyer au service parc</button>`}`;
  return `
  <div class="days" role="group" aria-label="Jour de la tournée">${hist.map((x,i)=>dayChip(x,i,'data-doneday',DONE_DAY)).join('')}</div>
  <div class="prog"><div class="prog-h"><span class="mlabel">${today?'Aujourd\'hui':esc(dayWord(DONE_DAY))}</span><b>${d.length}<span> véhicule${d.length>1?'s':''} fait${d.length>1?'s':''}</span></b></div>${pb?`<div class="spec">dont ${pb} avec un problème signalé</div>`:''}</div>
  ${d.length?`<div class="list">${d.map(x=>{const v=vehicle(x.plaque)||{};return `
    <button type="button" class="row" data-open="${esc(x.plaque)}">
      <span class="okdot ${x.pending?'wait':x.pb.length?'ko':''}" aria-hidden="true">${x.pending?I.clock:x.pb.length?'!':I.tick}</span>
      <span class="row-b"><span class="plate">${esc(x.plaque)}</span><span class="model">${esc(v.modele||'')}</span>
      <span class="spec">${esc(x.point)} · ${esc(x.at.slice(11).replace(':','h'))}${x.pending?' · pas encore envoyé':''}</span>
      ${x.pb.length?`<span class="mini dmg"><i></i>${esc(x.pb.join(', '))}</span>`:'<span class="mini ok"><i></i>Tout est OK</span>'}</span>
      <span class="chev">${I.chev}</span>

}

function searchResults(){
  const q=norm(query);const res=q.length>=2?[...vehicles().values()].filter(v=>norm(v.plaque).includes(q)).slice(0,8):[];
  const raw=query.trim().toUpperCase();
  return `${res.map(v=>rowHtml(v.plaque,`<span class="plate">${esc(v.plaque)}</span><span class="model">${esc(v.modele||'')}</span>`)).join('')}
    ${q.length>=2&&!res.length?'<div class="meta">Aucun véhicule de la flotte ne correspond.</div>':''}
    ${raw.length>=7&&!vehicles().has(raw)?`<button type="button" class="btn wide" data-open="${esc(raw)}">Continuer avec ${esc(raw)}</button>`:''}`;
}

  <div class="sh-body pad">
    <label class="mlabel" for="q">${sheet.remind?'Rappel pour quel véhicule ? Tapez la plaque':'Plaque du véhicule'}</label>

function vSheet(){
  if(sheet.search)return vSearch();
  if(sheet.asks)return vAsks();
  const p=sheet.plaque;const v=vehicle(p)||{plaque:p,events:[]};const now=DAY===TODAY;const st=stayFor(p,DAY);
  const done=passageOf(p);const mine=done&&done.by===S.who;
  const asks=allAsks().filter(d=>d.plaque===p).sort((a,b)=>a.date.localeCompare(b.date));
  const top=`<div class="sh-top pad"><button type="button" class="back" id="${sheet.step==='fiche'?'closeSheet':'backFiche'}">${I.back}Retour</button></div>

    const opts=[['Demain',1],['Après-demain',2],['Dans 1 semaine',7],['Dans 2 semaines',14]];

    <div class="sh-body pad">
      <div class="q">Me le rappeler quand ?</div>
      <div class="tiles">${opts.map(([t,n])=>{const d=plusDays(n);const on=!rdraft.other&&rdraft.date===d;const l=dLabel(d);return `<button type="button" class="tile pick ${on?'on':''}" data-rdate="${d}" aria-pressed="${on}">${t}<br><small>${esc(l.dow.toLowerCase()+' '+l.num)}</small></button>`}).join('')}
        <button type="button" class="tile pick ${rdraft.other?'on':''}" data-rother="1" aria-pressed="${rdraft.other}">Autre date</button></div>
      ${rdraft.other?`<label class="mlabel" for="rDate">Date du rappel</label><input type="date" id="rDate" class="dateinput" min="${plusDays(1)}" max="${plusDays(90)}" value="${esc(rdraft.date)}">`:''}
      <div class="q">Sur quel point ?</div>
      <div class="tiles">${LOCAL.map(pt=>{const on=rdraft.point===pt;return `<button type="button" class="tile pick ${on?'on':''}" data-rpoint="${esc(pt)}" aria-pressed="${on}">${esc(full(pt))}</button>`}).join('')}</div>
      <textarea id="rNote" placeholder="Pourquoi ? (facultatif)" maxlength="200">${esc(rdraft.note)}</textarea>
      <div class="meta">Ce jour-là, le véhicule apparaît en rouge dans la liste de ce point. Vous seul le voyez, et le service parc.</div>
    </div>
    <div class="sh-foot pad"><button type="button" class="btn big primary" id="saveRem" ${rdraft.date?'':'disabled'}>Enregistrer le rappel</button></div>`;
  }
  if(sheet.step==='probleme')return top+`
    <div class="sh-body pad">
      <div class="q">Quel problème ?</div>
      <div class="tiles">${DAMAGES.concat(OTHER).map(d=>`<button type="button" class="tile ${draft.types.includes(d)?'on':''}" data-dmg="${esc(d)}" aria-pressed="${draft.types.includes(d)}">${esc(d)}</button>`).join('')}</div>
      ${draft.photos.length?`<div class="photos">${draft.photos.map((u,i)=>`<div class="ph ${u.indexOf('data:')===0?'':'demo'}">${u.indexOf('data:')===0?`<img src="${u}" alt="Photo ${i+1}">`:'Photo '+(i+1)}<button type="button" class="ph-x" data-rmphoto="${i}" aria-label="Retirer la photo ${i+1}">×</button></div>`).join('')}</div>`:''}
      ${draft.photos.length<MAX_PHOTOS?`<label class="btn wide photo" for="photo">${I.camera}<span id="photoName">${draft.photos.length?'Ajouter une photo ('+draft.photos.length+'/'+MAX_PHOTOS+')':'Prendre une photo (facultatif)'}</span></label>
      <input type="file" id="photo" accept="image/*" capture="environment" hidden>`:`<div class="meta">${MAX_PHOTOS} photos maximum.</div>`}

    </div>
    <div class="sh-foot pad"><button type="button" class="btn big warn" id="saveDmg" ${draft.types.length?'':'disabled'}>Valider le problème</button></div>`;
  const ev=v.events||[];
  return top+`
    <div class="sh-body pad">
      ${done?`<div class="status ${done.pb.length?'ko':'ok'}">${done.pb.length?'Problème signalé : '+esc(done.pb.join(', ')):'Validé'}${mine?'':' par '+esc(done.by)} · ${esc(when(done.at))}</div>`:''}
      ${now?'':`<div class="later">Vous regardez ${esc(leWord(DAY))}. La validation se fait le jour même.</div>`}
      ${asks.map(askBlock).join('')}
      ${st?`<div class="card0 times">${timeCell('Arrivée',st.from,st.fromCity?'de '+st.fromCity:'','Déjà sur place')}<div class="sep" aria-hidden="true"></div>${timeCell('Départ',st.to,st.toCity?'vers '+st.toCity:'','Non planifié')}</div>`:''}
      ${st?st.impros.map(improBlock).join(''):''}

    </div>
    <div class="sh-foot pad">
      ${now?`<button type="button" class="btn big primary" id="okBtn">${I.tick}Tout est OK</button>

    </div>`;
}

/* « Vendredi 16 octobre » */
function fullDay(isoD){const [y,m,d]=isoD.split('-').map(Number);return ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][new Date(y,m-1,d).getDay()]+' '+(d===1?'1er':d)+' '+['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'][m-1]}
function report(){
  const d=doneToday().slice().reverse();const l=dLabel(TODAY);const lines=[];
  lines.push('*'+fullDay(TODAY)+'*');
  lines.push(plural(d.length,'véhicule')+' vu'+(d.length>1?'s':''));
  [...new Set(d.map(x=>x.point))].forEach(p=>{lines.push('');lines.push('*'+p+'*');
    d.filter(x=>x.point===p).forEach(x=>lines.push(x.plaque+(x.pb.length?' · Problème : '+x.pb.join(', ')+(x.comment?' ('+x.comment+')':'')+(x.photo?' · photo':''):'')))});
  const left=todo();if(left.length){lines.push('');lines.push('*Pas vus*');left.forEach(s=>lines.push(s.plaque))}
  const pa=partis();if(pa.length){lines.push('');lines.push('*Partis avant passage*');pa.forEach(s=>lines.push(s.plaque))}
  return lines.join('\n');
}

function sourceLine(){
  if(DEMO)return `<span>${esc(S.sourceLabel||'Démonstration')}</span><label for="csvFile">Charger un export</label>`;
  const wait=S.queue.length?' · '+plural(S.queue.length,'envoi')+' en attente':'';
  let txt;
  if(S.misAJour){const d=new Date(S.misAJour);txt=isNaN(d)?'Planning reçu':'Planning du '+dLabel(iso(d)).num+' à '+hm(d).replace(':','h')}
  else txt=S.synced?'Planning pas encore reçu':'Chargement…';
  if(S.offline&&S.oldScript)txt='Envois en attente : script Google à mettre à jour';
  else if(S.offline)txt=(navigator.onLine===false?'Pas de réseau':'Google ne répond pas, nouvel essai automatique')+(S.synced?' · données de '+S.synced.slice(11).replace(':','h'):'');
  return `<span>${esc(txt+wait)}</span><button type="button" id="refresh">Actualiser</button>`;
}
let lastCk='';
/* Ne touche l'écran que si son contenu change : ouvrir une fiche ne redessine pas la liste derrière */
function put(el,html){if(el._h!==html){el._h=html;el.innerHTML=html}}
function render(bg){
  index();badge();
  const sc=S.screen==='done'?'done':'home';const l=dLabel(TODAY);
  const ws=$('#whoSlot');
  if(DEMO){put(ws,`<button type="button" id="who" class="who" aria-haspopup="true" aria-expanded="${picker}">${I.user}${esc(S.who)} <span aria-hidden="true">&#9662;</span></button>`)}
  else put(ws,S.who?`<span class="who">${I.user}${esc(S.who)}</span>`:'');
  const dl=dLabel(DAY);let up='';if(!DEMO&&S.misAJour){const m=new Date(S.misAJour);if(!isNaN(m))up=' · planning de '+hm(m).replace(':','h').replace(/h00$/,'h')}
  $('#sub').textContent=dl.dow+' '+dl.num+up;
  /* La ligne d'état ne s'affiche qu'en cas de souci (pas de réseau, envois en attente, pas de planning) */
  const alert=!DEMO&&(S.offline||S.queue.length>0||(S.synced&&!S.misAJour));
  const src=$('#source');put(src,sourceLine());src.classList.toggle('alert',alert);
  let blocked='';
  if(!DEMO&&!CODE)blocked=gate('Ce téléphone n\'est pas encore relié','Demandez au service parc de vous installer l\'appli avec votre lien personnel.');
  else if(!DEMO&&S.blocked)blocked=gate('Lien non reconnu',esc(S.blocked));
  else if(!DEMO&&S.syncErr&&!S.loc.length)blocked=gate('Google ne répond pas','Le planning n\'a pas pu être chargé. Nouvel essai automatique dans un instant.');
  else if(!DEMO&&!ready)blocked=gate('Chargement…','Ouverture de votre planning.');
  else if(!DEMO&&!S.synced)blocked=S.offline?gate(navigator.onLine===false?'Pas de réseau':'Google ne répond pas','L\'appli a besoin d\'internet la première fois. Nouvel essai automatique dans 30 secondes.','<button type="button" class="btn wide primary" id="refresh">Réessayer</button>'):gate('Chargement…','Récupération de votre planning.');
  $('#title').textContent=blocked?'Runners':sc==='done'?'Ma tournée':DAY===TODAY?'Véhicules à voir':'Planning à venir';
  $('#nav').hidden=!!blocked;
  put($('#hsSlot'),blocked?'':`<button type="button" class="hsearch" id="openSearch">${I.search}<span>Chercher une plaque</span></button>`);
  if(blocked){$('#source').hidden=!!(DEMO||!CODE||S.blocked);put($('#view'),blocked);sheet=null}
  else{
    $('#source').hidden=!alert;
    put($('#view'),(picker?`<div class="picker" role="group" aria-label="Choisir le runner"><div class="mlabel">Qui fait la tournée ?</div><div class="choice">${RUNNERS.map(r=>`<button type="button" class="opt-row ${r===S.who?'on':''}" data-runner="${esc(r)}" aria-pressed="${r===S.who}"><span class="box">${r===S.who?I.tick:''}</span>${esc(r)}</button>`).join('')}</div><label for="csvFile" class="lnk2">Démonstration : charger un export Metabase</label></div>`:'')+(sc==='done'?vDone:vHome)());
    const ck=sc+DAY+DONE_DAY;if(ck!==lastCk){lastCk=ck;centerDays()}
    const n=todo().length+openAsks().length,dn=doneToday().length;
    put($('#tabs'),[['home','À faire',I.todo,n],['done','Ma tournée',I.done,dn]].map(([k,t,ic,c])=>`<button type="button" class="${k===sc?'on':''}" data-tab="${k}" aria-current="${k===sc?'page':'false'}">${ic}<span>${t} <b class="cnt">${c}</b></span></button>`).join(''));
  }
  /* Une mise à jour en arrière-plan ne redessine pas la fiche ouverte (on ne perd pas la saisie) */
  if(bg&&sheet){
    /* v44 : la page « Rappels et demandes » (rien à saisir) se met à jour seule, sinon une demande arrivée pendant qu'elle est ouverte n'apparaissait qu'en la rouvrant */
    if(sheet.asks)put($('#sheet'),vSheet());
    return}
  const sh=$('#sheet');
  if(sheet){sh.innerHTML=sh._h=vSheet();sh.hidden=false;document.body.classList.add('noscroll')}else{sh.hidden=true;sh.innerHTML=sh._h='';document.body.classList.remove('noscroll')}
  ecranChange();
}
function openSheet(p){query='';MINI.clear(); /* v42 : aperçus des photos d'avant oubliés (gardés toute la journée avant) */const x=passageOf(p);draft=x&&x.by===S.who&&x.pb.length?{types:x.pb.slice(),photos:[],comment:x.comment}:{types:[],photos:[],comment:''};sheet={plaque:p,step:'fiche'};render();$('#sheet').scrollTop=0}
function closeSheet(msg){sheet=sheet&&!sheet.asks&&sheet.back==='asks'?{asks:true}:null;render();if(msg)toast(msg)}
function set(patch){Object.assign(S,patch);save();render()}

/* Photo réduite à 1280 px pour un envoi rapide */
function compress(file){
  return new Promise((ok,ko)=>{const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const s=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.72))};
    img.onerror=()=>{URL.revokeObjectURL(url);ko(new Error('photo'))};img.src=url});
}

/* ---------- Événements ---------- */
/* v42 : un double appui (doigt qui tremble, gants) ne touche pas l'écran qui vient d'apparaître : avant, le deuxième appui
   sur « Tout est OK » ouvrait la fiche du véhicule suivant (et un troisième pouvait le valider sans le voir) */
let calme=0,ecranVu='',dernierAppui={x:-99,y:-99,t:0};
function ecranChange(){const k=sheet?(sheet.search?'s':sheet.asks?'a':sheet.plaque+'|'+sheet.step):'l|'+S.screen+'|'+showReport;
  if(k!==ecranVu){if(ecranVu&&Date.now()-dernierAppui.t<1000)calme=Date.now()+350;ecranVu=k}}
document.addEventListener('click',e=>{
  /* Seul un appui au même endroit, juste après le changement d'écran, est ignoré (un appui voulu ailleurs passe ;
     « Retour » deux fois de suite reste permis) */
  if(Date.now()<calme&&Math.abs(e.clientX-dernierAppui.x)<32&&Math.abs(e.clientY-dernierAppui.y)<32&&e.target.closest('button,label,input,a')&&!e.target.closest('.back')){e.preventDefault();e.stopPropagation();return}
  dernierAppui={x:e.clientX,y:e.clientY,t:Date.now()};
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(b.id==='who'){picker=!picker;render();return}
  if(d.runner){picker=false;set({who:d.runner});toast('Tournée de '+d.runner+'.');return}
  if(d.tab){showReport=false;if(d.tab==='done'){DAY=TODAY;DONE_DAY=TODAY}set({screen:d.tab});window.scrollTo(0,0);return}
  if(d.day){if(dragged)return;DAY=d.day;render();window.scrollTo(0,0);return}
  if(d.doneday){if(dragged)return;DONE_DAY=d.doneday;showReport=false;render();return}
  if(b.id==='remBtn'){rdraft=newRemind(sheet.plaque);sheet.step='rappel';render();$('#sheet').scrollTop=0;return}
  if(d.rdate){rdraft.date=d.rdate;rdraft.other=false;render();return}
  if(d.rother){rdraft.other=true;rdraft.date='';render();return}
  if(b.id==='saveRem'){const p=sheet.plaque,dt0=rdraft.date;remind(p,dt0,rdraft.note.trim(),rdraft.point);closeSheet('Rappel enregistré pour '+dayWord(dt0).replace(/\.$/,'')+'.');return}
  if(d.unremind){unremind(d.unremind);render();toast('Rappel supprimé.');return}
  if(d.point){const p=d.point;set({myPoints:S.myPoints.includes(p)?S.myPoints.filter(x=>x!==p):S.myPoints.concat(p),ptsSet:true});return}
  if(d.open){const rem=sheet&&sheet.remind,back=sheet&&(sheet.asks||sheet.back==='asks')?'asks':'';openSheet(d.open);if(back)sheet.back=back;if(rem){rdraft=newRemind(d.open);sheet.step='rappel'}render();return}
  if(d.rpoint){rdraft.point=d.rpoint;render();return}
  if(b.id==='openAsks'){sheet={asks:true,nouv:newAsks().map(d=>d.id)};markAsksSeen();render();$('#sheet').scrollTop=0;return}
  if(b.id==='enableNotif'){try{Promise.resolve(Notification.requestPermission()).then(p=>p==='granted'?abonner().then(ok=>{if(ok)toast('Alertes activées : vous serez prévenu des nouvelles demandes');else toast('Alertes impossibles sur ce téléphone pour le moment')}):null).then(()=>render())}catch(e){}return}
  if(b.id==='absentBtn'){const p=sheet.plaque;record(p,['Pas trouvé sur place'],'',[]);closeSheet(p+' signalé pas sur place. Le service parc sera prévenu.');return}
  if(b.id==='refresh'){S.offline=false;run(true);return}
  if(b.id==='openSearch'){query='';sheet={search:true};render();$('#q').focus();return}
  if(b.id==='openRemind'){query='';sheet={search:true,remind:true,back:sheet&&sheet.asks?'asks':''};render();$('#q').focus();return}
  if(b.id==='closeSheet'){closeSheet();return}
  if(b.id==='backFiche'){sheet.step='fiche';render();return}
  if(b.id==='okBtn'){const p=sheet.plaque;record(p,[],'','');closeSheet(p+' validé. Tout est OK.');return}
  if(b.id==='pbBtn'){sheet.step='probleme';render();$('#sheet').scrollTop=0;return}
  if(d.rmphoto){draft.photos.splice(+d.rmphoto,1);render();return}
  if(d.dmg){const i=draft.types.indexOf(d.dmg);i<0?draft.types.push(d.dmg):draft.types.splice(i,1);render();return}
  if(b.id==='saveDmg'){const p=sheet.plaque;record(p,draft.types.slice(),draft.comment.trim(),draft.photos.slice());closeSheet(p+' validé avec un problème. Le service parc sera prévenu.');return}
  if(b.id==='undo'){const p=sheet.plaque;undo(p);closeSheet('Validation annulée pour '+p+'.');return}
  if(b.id==='finish'){showReport=true;render();window.scrollTo(0,0);return}
  if(b.id==='closeReport'){showReport=false;render();return}
  if(b.id==='copy'){const txt=report();try{navigator.clipboard.writeText(txt).then(()=>toast('Message copié.'),selectReport)}catch(err){selectReport()}return}
  if(b.id==='send'){b.disabled=true;b.textContent='Envoi…';
    call(null,{code:CODE,action:'rapport',texte:report().slice(0,2900)}) /* v42 : Google n'en garde que 2900 caractères ; l'adresse reste courte */.then(r=>{if(r.erreur)throw new Error(r.erreur);showReport=false;render();toast(r.slack?'Tournée envoyée au service parc.':'Tournée enregistrée. Le service parc la voit sur sa page.')})
      .catch(()=>{b.disabled=false;b.textContent='Envoyer au service parc';toast('Pas de réseau. Réessayez dans un moment.')});return}
});
function selectReport(){const r=document.createRange();r.selectNodeContents($('#reportText'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Texte sélectionné : copiez-le avec un appui long.')}
document.addEventListener('input',e=>{
  if(e.target.id==='q'){query=e.target.value;const r=$('#qres');if(r)r.innerHTML=searchResults()}
  if(e.target.id==='comment')draft.comment=e.target.value;
  if(e.target.id==='rNote')rdraft.note=e.target.value;
  if(e.target.id==='rDate'){rdraft.date=/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)&&e.target.value>TODAY?e.target.value:'';const b=$('#saveRem');if(b)b.disabled=!rdraft.date}
});
document.addEventListener('change',e=>{
  if(e.target.id==='rDate'){rdraft.date=/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)&&e.target.value>TODAY?e.target.value:'';const b=$('#saveRem');if(b)b.disabled=!rdraft.date}
  if(e.target.id==='photo'){const f=e.target.files[0];if(!f)return;$('#photoName').textContent='Préparation de la photo…';
    compress(f).then(u=>{if(draft.photos.length<MAX_PHOTOS)draft.photos.push(DEMO?'photo':u);render();if(!DEMO)miniOf(u).then(m=>{if(m)MINI.set(u,m)})},()=>{render();toast('Photo illisible. Réessayez.')})}
  if(e.target.id==='csvFile'){const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const t=parseCsv(String(r.result));const m=new Date(f.lastModified||Date.now());
      set({loc:t.loc,impros:t.impros,plan:null,sourceLabel:'Export du '+dLabel(iso(m)).num+' à '+hm(m).replace(':','h')});
      toast('Export chargé : '+plural(t.loc.length,'location')+', '+plural(t.impros.length,'improductif')+'.')}catch(err){toast('Fichier non lu. '+err.message)}e.target.value=''};
    r.readAsText(f,'utf-8')}
});
/* Rangée des jours : molette et glisser à la souris (au doigt, le défilement est natif) */
let dragged=false,drag=null;
document.addEventListener('wheel',e=>{const r=e.target.closest('.days');if(!r||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;r.scrollLeft+=e.deltaY;e.preventDefault()},{passive:false});
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.days');dragged=false;if(r&&e.pointerType==='mouse')drag={r,x:e.clientX,l:r.scrollLeft}});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>5)dragged=true;drag.r.scrollLeft=drag.l-dx});
document.addEventListener('pointerup',()=>{drag=null;setTimeout(()=>{dragged=false},0)});
addEventListener('resize',()=>centerDays());addEventListener('load',()=>centerDays());
function centerDays(){document.querySelectorAll('.days').forEach(r=>{const on=r.querySelector('.day.on');if(on)r.scrollLeft=on.offsetLeft-r.offsetLeft-(r.clientWidth-on.offsetWidth)/2})}
window.addEventListener('online',()=>{S.offline=false;run(true)});
/* v39 : mise à jour sans fermer l'appli. Elle regarde s'il y a une nouvelle version quand elle revient à l'écran
   (et chaque minute depuis la v41) ; la nouvelle version s'installe en fond, puis l'appli se recharge seule quand c'est sans
   risque : en revenant à l'écran, ou après 30 s sans toucher l'écran (2 min en v39-v40), jamais avec une fiche, une recherche ou un
   envoi en cours. Les envois en attente sont sauvegardés avant. */
let swReg=null,majPrete=false,majVue=0,dernierGeste=0,revenuA=Date.now();
const AVAIT_SW=!!('serviceWorker' in navigator&&navigator.serviceWorker.controller); /* premier lancement : rien à recharger */
['pointerdown','keydown','input'].forEach(t=>document.addEventListener(t,()=>{dernierGeste=Date.now()},true));
function chercherMaj(){if(swReg&&Date.now()-majVue>25000){majVue=Date.now();try{swReg.update().catch(()=>{})}catch(e){}}}
function majSansRisque(revient){const a=document.activeElement;
  return !sheet&&!picker&&!showReport&&!busy&&!(a&&a.matches&&a.matches('input,textarea,select'))&&(revient||Date.now()-dernierGeste>30000
    /* nouvelle version arrivée juste après l'ouverture, avant tout geste : comme au retour à l'écran */
    ||(Date.now()-revenuA<20000&&dernierGeste<revenuA))}
function appliquerMaj(revient){
  if(!majPrete||document.visibilityState!=='visible'||!majSansRisque(revient))return;
  /* Garde-fou : jamais deux rechargements de suite */
  try{const t=+sessionStorage.getItem('runners-maj')||0;if(Date.now()-t<60000)return;sessionStorage.setItem('runners-maj',String(Date.now()))}catch(e){}
  majPrete=false;save();try{sessionStorage.setItem('runners-jour',JSON.stringify({d:DAY,t:Date.now()}))}catch(e){}location.reload()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){revenuA=Date.now();appliquerMaj(true);chercherMaj();run(true)}else flushOnHide()});
setInterval(()=>{if(document.visibilityState==='visible'){appliquerMaj(false);run(true)}},REFRESH_MS); /* avant run : un envoi en cours bloquerait la mise à jour */
setInterval(()=>{if(document.visibilityState==='visible')chercherMaj()},60*1000); /* v41 : chaque minute (petit fichier) */
/* v40 : les notifications coupées dans les Réglages pendant que l'appli est ouverte : le bouton revient tout de suite */
try{if(!DEMO&&navigator.permissions&&navigator.permissions.query)navigator.permissions.query({name:'notifications'}).then(st=>{st.onchange=()=>{render(true);if(st.state==='granted'&&S.vapid)abonner()}}).catch(()=>{})}catch(e){}
cfgSw();
const A_OUVRIR=location.hash==='#demandes';if(A_OUVRIR)try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
try{if(!DEMO&&'serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='demandes'&&ready)ouvrirDemandes()})}catch(e){}
if(!DEMO&&'serviceWorker' in navigator&&(location.protocol==='https:'||(location.hostname==='localhost'&&(()=>{try{return localStorage.getItem('runners-test-sw')==='1'}catch(e){return false}})()))){try{
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(AVAIT_SW){majPrete=true;appliquerMaj(false)}});
  navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{})}catch(e){}}
if(ready)(A_OUVRIR?ouvrirDemandes:run)();
else{render(true);IDB.get(STORE+'-plan').then(pl=>{
  if(pl&&(pl.lignes||pl.loc)){try{const t=readPlan(pl);S.loc=t.loc;S.impros=t.impros;S.plan=pl}catch(e){}}
  if(!S.plan)S.misAJour='';
  return IDB.get(STORE+'-pas')}).then(pa=>{if(Array.isArray(pa)){const loc=S.passages.filter(x=>x.local);S.passages=pa;
    loc.forEach(x=>{if(!pa.some(y=>y.at===x.at&&y.by===x.by&&y.cle===x.cle))S.passages.push(x)})}else if(S.passages.length)savePassages()}).finally(()=>{ready=true;(A_OUVRIR?ouvrirDemandes:run)()})}
})();
</script>
